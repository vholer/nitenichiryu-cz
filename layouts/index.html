{{ define "main" }}
<section class="hero">
  <div class="hero-bg">
    <img src="{{ "images/musashi3.jpg" | relURL }}" alt="Portrét Miyamota Musashiho v červeném kimonu" width="2583" height="3868" fetchpriority="high">
  </div>
  <div class="hero-copy">
    <p class="eyebrow">{{ .Params.lead | safeHTML }}</p>
    <h1 class="hero-title">{{ .Title }}</h1>
    <div class="hero-text">
      {{ .Content }}
    </div>
    <div class="hero-actions">
      <a class="btn btn-outline-primary btn-lg rounded-pill" href="{{ "skola/hnir/" | relURL }}">O škole</a>
      <a class="btn btn-primary btn-lg rounded-pill" href="{{ "cviceni/dojo/" | relURL }}">
        Kde cvičit
        {{ partial "inline-svg" (dict "src" "outline/arrow-right" "class" "icon ms-1" "width" "20" "height" "20" "aria-hidden" "true") }}
      </a>
    </div>
  </div>
</section>

{{ end }}
